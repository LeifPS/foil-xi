<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOIL ELEVEN — Vorübergehend offline</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --pitch:#060a05;
    --pitch-line:#16321d;
    --surface:#0d130c;
    --turf:#3ddc84;
    --turf-dim:#1f8f52;
    --gold:#ffd76a;
    --chalk:#eef5ee;
    --muted:#8a9a8c;
    --line:#233022;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--pitch);
    font-family:'Inter',sans-serif;
    color:var(--chalk);
    overflow-x:hidden;
    position:relative;
  }

  /* ===== signature: top-down floodlit pitch at night ===== */
  .pitch{
    position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(61,220,132,.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(61,220,132,.06), transparent 65%),
      linear-gradient(180deg, #070c06, #050805 60%, #040603);
  }
  .pitch svg{ position:absolute; inset:0; width:100%; height:100%; }
  .pitch-lines{ stroke:var(--pitch-line); stroke-width:1.4; fill:none; opacity:.9; }
  .pitch-stripe{ fill:rgba(61,220,132,.025); }

  .beam{
    position:fixed; top:-10%; left:50%;
    width:140vw; height:120vh;
    transform-origin:50% 0%;
    background:conic-gradient(from 90deg at 50% 0%, transparent 42%, rgba(61,220,132,.05) 49.5%, rgba(61,220,132,.08) 50%, rgba(61,220,132,.05) 50.5%, transparent 58%);
    animation:sweep 9s ease-in-out infinite;
    z-index:0;
    pointer-events:none;
  }
  @keyframes sweep{
    0%,100%{ transform:translateX(-50%) rotate(-16deg); }
    50%{ transform:translateX(-50%) rotate(16deg); }
  }

  /* ===== layout ===== */
  main{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px;
  }

  .board{
    width:100%; max-width:460px;
    background:linear-gradient(165deg, var(--surface), #0a0e08 85%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:38px 34px 30px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
    text-align:center;
  }

  .crest{
    width:56px; height:56px; margin:0 auto 20px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--turf), var(--turf-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:'Anton',sans-serif; font-size:21px; letter-spacing:.02em;
    color:#062a14;
    box-shadow:0 10px 22px -6px rgba(61,220,132,.5);
  }

  .brand{
    font-family:'Anton',sans-serif;
    font-size:15px; letter-spacing:.22em;
    color:var(--muted);
    margin-bottom:26px;
  }
  .brand b{ color:var(--chalk); font-weight:400; letter-spacing:.22em; }

  /* stadium substitution-board readout */
  .readout{
    background:#040703;
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 18px 18px;
    margin-bottom:26px;
    position:relative;
    overflow:hidden;
  }
  .readout::before{
    content:'';
    position:absolute; inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.015) 0 1px, transparent 1px 3px);
    pointer-events:none;
  }
  .readout .row1{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.14em;
    color:var(--turf);
    margin-bottom:10px;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .readout .row1 i{
    width:7px; height:7px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 8px 1px rgba(255,215,106,.7);
    animation:blink 1.6s step-start infinite;
    font-style:normal;
  }
  @keyframes blink{ 50%{ opacity:.15; } }
  .readout .status{
    font-family:'Anton',sans-serif;
    font-size:38px; letter-spacing:.05em;
    color:var(--chalk);
    line-height:1;
    text-shadow:0 0 26px rgba(61,220,132,.25);
  }

  p{
    font-size:14.5px; line-height:1.7;
    color:#b7c6b9;
    margin:0 0 14px;
  }
  p:last-of-type{ margin-bottom:0; }
  p strong{ color:var(--chalk); font-weight:600; }

  .foot{
    margin-top:28px; padding-top:18px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.04em;
    color:#5a6b5c;
  }

  @media (prefers-reduced-motion: reduce){
    .beam{ animation:none; transform:translateX(-50%) rotate(0deg); }
    .readout .row1 i{ animation:none; }
  }

  @media (max-width:420px){
    .board{ padding:30px 24px 24px; }
    .readout .status{ font-size:32px; }
  }
</style>
</head>
<body>

  <div class="pitch" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <rect class="pitch-stripe" x="0" y="0" width="400" height="80"/>
      <rect class="pitch-stripe" x="0" y="160" width="400" height="80"/>
      <rect class="pitch-stripe" x="0" y="320" width="400" height="80"/>
      <rect class="pitch-stripe" x="0" y="480" width="400" height="80"/>
      <rect class="pitch-stripe" x="0" y="640" width="400" height="80"/>
      <rect class="pitch-lines" x="16" y="16" width="368" height="768" rx="4"/>
      <line class="pitch-lines" x1="16" y1="400" x2="384" y2="400"/>
      <circle class="pitch-lines" cx="200" cy="400" r="58"/>
      <circle class="pitch-lines" cx="200" cy="400" r="2.5" fill="var(--pitch-line)"/>
      <rect class="pitch-lines" x="90" y="16" width="220" height="88"/>
      <rect class="pitch-lines" x="90" y="696" width="220" height="88"/>
      <rect class="pitch-lines" x="140" y="16" width="120" height="34"/>
      <rect class="pitch-lines" x="140" y="750" width="120" height="34"/>
    </svg>
  </div>
  <div class="beam" aria-hidden="true"></div>

  <main>
    <div class="board">
      <div class="crest">FE</div>
      <div class="brand">FOIL <b>ELEVEN</b></div>

      <div class="readout">
        <div class="row1"><i></i>ANZEIGETAFEL</div>
        <div class="status">OFFLINE</div>
      </div>

      <p>Der Anpfiff lässt gerade auf sich warten — wir reißen hinter den Kulissen ein paar Tribünen ab und bauen sie neu auf.</p>
      <p><strong>Das Spiel ist im Moment nicht spielbar.</strong> Spätestens morgen ist es wieder online.</p>

      <div class="foot">FOIL ELEVEN · Wird derzeit wiederaufgebaut</div>
    </div>
  </main>

</body>
</html>
